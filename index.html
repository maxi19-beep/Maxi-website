<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Target Shooter Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; overflow: hidden; cursor: crosshair; }
        
        #ui { position: fixed; top: 20px; left: 20px; z-index: 100; color: #fff; }
        .stat { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px; margin-bottom: 10px; font-size: 18px; font-weight: bold; }
        #startScreen, #gameOver { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 20px; color: #00ff88; }
        button { padding: 15px 40px; font-size: 22px; background: #00ff88; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { transform: scale(1.05); background: #00dd77; }
        #gameOver { display: none; }
        .target { position: absolute; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); transition: 0.1s; }
        .hit { background: #ff0055 !important; transform: scale(0); }
        .crosshair { position: fixed; pointer-events: none; font-size: 24px; transform: translate(-50%, -50%); z-index: 50; }
    </style>
</head>
<body>

    <!-- UI Panel -->
    <div id="ui">
        <div class="stat">🎯 Score: <span id="score">0</span></div>
        <div class="stat">⏱️ Time: <span id="time">30</span>s</div>
        <div class="stat">🎯 Hits: <span id="hits">0</span> / <span id="shots">0</span></div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen">
        <h1>🔫 TARGET SHOOTER</h1>
        <p style="font-size: 20px; margin-bottom: 30px; max-width: 400px;">Click or tap to shoot targets before time runs out!<br>Fast targets = More points!</p>
        <button onclick="startGame()">START GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOver">
        <h1>🏁 GAME OVER!</h1>
        <p style="font-size: 28px; margin-bottom: 10px;">Final Score: <span id="finalScore">0</span></p>
        <p style="font-size: 20px; margin-bottom: 30px;">Accuracy: <span id="accuracy">0</span>%</p>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let hits = 0;
        let shots = 0;
        let gameRunning = false;
        let gameTimer;
        let targets = [];

        const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#a855f7', '#ff6b91'];

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            score = 0; timeLeft = 30; hits = 0; shots = 0;
            updateUI();
            gameRunning = true;
            spawnTarget();
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameTimer);
            clearAllTargets();
            document.getElementById('finalScore').textContent = score;
            const acc = shots > 0 ? Math.round((hits / shots) * 100) : 0;
            document.getElementById('accuracy').textContent = acc;
            document.getElementById('gameOver').style.display = 'flex';
        }

        function restartGame() { startGame(); }

        function createTarget() {
            const t = document.createElement('div');
            t.className = 'target';
            const size = 50 + Math.random() * 40;
            const speed = Math.max(1500, 3500 - score * 15); // Faster as score increases
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            t.style.width = size + 'px';
            t.style.height = size + 'px';
            t.style.background = color;
            t.style.boxShadow = `0 0 20px ${color}80, inset 0 0 15px rgba(255,255,255,0.3)`;
            
            // Random position
            const margin = 100;
            let x = margin + Math.random() * (window.innerWidth - size - margin * 2);
            let y = margin + Math.random() * (window.innerHeight - size - margin * 2);
            t.style.left = x + 'px';
            t.style.top = y + 'px';
            
            // Points based on size — smaller = more points
            const points = Math.round(100 - size);
            t.dataset.points = points > 10 ? points : 10;
            
            // Click to shoot
            t.addEventListener('click', (e) => {
                if (!gameRunning) return;
                e.stopPropagation();
                hits++;
                score += parseInt(t.dataset.points);
                t.classList.add('hit');
                setTimeout(() => { t.remove(); }, 100);
                updateUI();
                clearTimeout(t.timeout);
                spawnTarget();
            });
            
            document.body.appendChild(t);
            targets.push(t);
            
            // Auto-remove if not hit
            t.timeout = setTimeout(() => {
                if (t.parentNode) {
                    t.style.transition = 'opacity 0.3s';
                    t.style.opacity = '0';
                    setTimeout(() => { t.remove(); }, 300);
                    spawnTarget();
                }
            }, speed);
        }

        function spawnTarget() { if (gameRunning) createTarget(); }

        function clearAllTargets() {
            targets.forEach(t => { clearTimeout(t.timeout); if(t.parentNode) t.remove(); });
            targets = [];
        }

        // Count shots on empty clicks
        document.addEventListener('click', () => {
            if (gameRunning) {
                shots++;
                updateUI();
            }
        });

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('hits').textContent = hits;
            document.getElementById('shots').textContent = shots;
        }

        // Handle window resize
        window.addEventListener('resize', clearAllTargets);
    </script>
</body>
</html>
