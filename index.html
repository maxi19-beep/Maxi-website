<!DOCTYPE html>
<html>
<head>
    <title>MAXI CHAT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f0f4f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== LOGIN SCREEN ===== */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a73e8, #0d9c48);
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .login-box h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 10px;
        }
        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        .login-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .login-box input:focus {
            outline: none;
            border-color: #1a73e8;
        }
        .btn-join {
            width: 100%;
            padding: 15px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-join:hover {
            background: #1557b0;
        }

        /* ===== CHAT SCREEN ===== */
        .chat-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        .chat-header {
            background: #1a73e8;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .chat-header h2 {
            font-size: 18px;
        }
        .user-info {
            font-size: 13px;
            opacity: 0.9;
        }
        .btn-leave {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        /* ===== MESSAGES AREA ===== */
        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 16px;
            max-width: 80%;
        }
        .message.you {
            margin-left: auto;
        }
        .message .sender {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .message.you .sender {
            text-align: right;
            display: none;
        }
        .message .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            background: white;
            border: 1px solid #eee;
            line-height: 1.4;
            font-size: 15px;
        }
        .message.you .bubble {
            background: #1a73e8;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.other .bubble {
            border-bottom-left-radius: 4px;
        }
        .time {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
        }
        .message.you .time {
            text-align: right;
        }
        .system-msg {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin: 15px 0;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #ddd;
            border-radius: 24px;
            font-size: 15px;
        }
        .input-area input:focus {
            outline: none;
            border-color: #1a73e8;
        }
        .btn-send {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-send:hover {
            background: #1557b0;
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN SCREEN ===== -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>💬 MAXI CHAT</h1>
            <p>Enter your name to join the chat</p>
            <input type="text" id="yourName" placeholder="Your nickname" maxlength="20">
            <button class="btn-join" onclick="joinChat()">🚀 Join Chat</button>
        </div>
    </div>

    <!-- ===== CHAT SCREEN ===== -->
    <div class="chat-screen" id="chatScreen">
        <div class="chat-header">
            <div>
                <h2>💬 MAXI CHAT ROOM</h2>
                <div class="user-info" id="userInfo"></div>
            </div>
            <button class="btn-leave" onclick="leaveChat()">Leave</button>
        </div>

        <div class="messages-area" id="messagesArea"></div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message..." maxlength="500">
            <button class="btn-send" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let yourName = "";
        let messages = [];

        // Load saved messages & name
        function loadChat() {
            let savedName = localStorage.getItem('chatUserName');
            let savedMsgs = localStorage.getItem('chatMessages');
            if (savedName) yourName = savedName;
            if (savedMsgs) messages = JSON.parse(savedMsgs);
        }

        // Save to storage
        function saveMessages() {
            localStorage.setItem('chatMessages', JSON.stringify(messages));
        }

        // Join chat
        function joinChat() {
            let name = document.getElementById('yourName').value.trim();
            if (!name) {
                alert('⚠️ Please enter your name!');
                return;
            }
            yourName = name;
            localStorage.setItem('chatUserName', yourName);
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';
            document.getElementById('userInfo').textContent = 'Chatting as: ' + yourName;
            
            addSystemMessage(yourName + ' joined the chat ✅');
            renderMessages();
            
            // Auto focus input
            document.getElementById('messageInput').focus();
        }

        // Leave chat
        function leaveChat() {
            if (confirm('Are you sure you want to leave?')) {
                addSystemMessage(yourName + ' left the chat 👋');
                localStorage.removeItem('chatUserName');
                yourName = "";
                document.getElementById('chatScreen').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('yourName').value = "";
            }
        }

        // Add system message
        function addSystemMessage(text) {
            let time = getTime();
            messages.push({ type: 'system', text: text, time: time });
            saveMessages();
            renderMessages();
        }

        // Send message
        function sendMessage() {
            let input = document.getElementById('messageInput');
            let text = input.value.trim();
            if (!text) return;

            let time = getTime();
            messages.push({
                sender: yourName,
                text: text,
                time: time,
                isYou: true
            });
            saveMessages();
            input.value = "";
            renderMessages();

            // Simulate reply after 1-2 seconds
            if (Math.random() > 0.3) {
                setTimeout(function() {
                    let replies = [
                        "Nice! 👍",
                        "I hear you!",
                        "That's interesting 😊",
                        "Okay, got it!",
                        "Thanks for sharing!",
                        "Tell me more!"
                    ];
                    let randomReply = replies[Math.floor(Math.random() * replies.length)];
                    let randomName = "Friend";
                    messages.push({
                        sender: randomName,
                        text: randomReply,
                        time: getTime(),
                        isYou: false
                    });
                    saveMessages();
                    renderMessages();
                }, 1000 + Math.random() * 1000);
            }
        }

        // Get current time
        function getTime() {
            let now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            if (m < 10) m = "0" + m;
            return h + ":" + m;
        }

        // Render all messages
        function renderMessages() {
            let area = document.getElementById('messagesArea');
            area.innerHTML = "";

            for (let i = 0; i < messages.length; i++) {
                let msg = messages[i];
                
                if (msg.type === 'system') {
                    area.innerHTML += '<div class="system-msg">' + msg.text + ' • ' + msg.time + '</div>';
                } else {
                    let cls = msg.isYou ? 'message you' : 'message other';
                    area.innerHTML += '<div class="' + cls + '">' +
                        '<div class="sender">' + msg.sender + '</div>' +
                        '<div class="bubble">' + escapeHtml(msg.text) + '</div>' +
                        '<div class="time">' + msg.time + '</div>' +
                        '</div>';
                }
            }
            // Scroll to bottom
            area.scrollTop = area.scrollHeight;
        }

        // Escape special characters
        function escapeHtml(text) {
            let div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Enter key to send
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && yourName) {
                sendMessage();
            }
        });

        // Auto login if name saved
        document.addEventListener('DOMContentLoaded', function() {
            loadChat();
            if (yourName) {
                document.getElementById('yourName').value = yourName;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('chatScreen').style.display = 'flex';
                document.getElementById('userInfo').textContent = 'Chatting as: ' + yourName;
                renderMessages();
                document.getElementById('messageInput').focus();
            }
        });
    </script>
</body>
</html>
